name: FastAPI CI/CD

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: runsync-ai-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 최신 커밋 확인
      - name: Print latest commit
        run: |
          echo "Latest commit:"
          git log -1

      # 3. Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 및 Push
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/runsync-ai:latest
            ${{ secrets.DOCKER_USERNAME }}/runsync-ai:${{ github.sha }}

      # 6. EC2에 .env 파일 생성
      - name: Create .env file on EC2
        uses: appleboy/ssh-action@v1
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ENV_FILE
          script: |
            set -e

            umask 077
            printf '%s' "$ENV_FILE" > /home/ubuntu/.env

            chmod 600 /home/ubuntu/.env

      # 7. EC2에 Docker 컨테이너 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,IMAGE_TAG
          script: |
            set -e

            IMAGE="$DOCKER_USERNAME/runsync-ai:$IMAGE_TAG"

            # 최신 이미지 다운로드
            sudo docker pull "$IMAGE"

            # 기존 컨테이너 중지 및 삭제
            sudo docker stop runsync-ai || true
            sudo docker rm -f runsync-ai || true

            # 로그 디렉터리 생성
            mkdir -p /home/ubuntu/runsync-ai-logs

            # 새 컨테이너 실행
            sudo docker run -d \
              --name runsync-ai \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file /home/ubuntu/.env \
              -v /home/ubuntu/runsync-ai-logs:/app/logs \
              "$IMAGE"

            # 사용하지 않는 이미지 정리
            sudo docker image prune -f

            # 실행 중인 컨테이너 확인
            sudo docker ps
